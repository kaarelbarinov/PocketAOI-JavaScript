<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket AOI Pro</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #00f2ff; --ok: #10b981; --viga: #f43f5e; --neutral: #475569; --text: #f8fafc; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .main-layout { display: flex; flex-grow: 1; overflow: hidden; }
        .sidebar { width: 320px; min-width: 320px; background: var(--panel); padding: 20px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid #334155; overflow-y: auto; box-sizing: border-box; }
        .sidebar-right { border-left: 1px solid #334155; border-right: none; }
        
        #viewport { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #container { position: relative; line-height: 0; }
        video { max-width: 100%; max-height: 70vh; display: block; }
        canvas#mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: crosshair; }
        
        details { background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; flex-shrink: 0; }
        summary { padding: 12px; font-size: 10px; text-transform: uppercase; color: #94a3b8; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
        .card-content { padding: 0 12px 12px 12px; }
        
        .status-hero { padding: 15px; border-radius: 8px; text-align: center; font-weight: 900; font-size: 24px; border: 2px solid var(--neutral); margin-bottom: 10px; background: rgba(71, 85, 105, 0.1); color: var(--neutral); }
        .pass { color: var(--ok); border-color: var(--ok); background: rgba(16, 185, 129, 0.1); }
        .fail { color: var(--viga); border-color: var(--viga); background: rgba(244, 63, 94, 0.1); }
        
        .preview-container { width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; background: #000; border: 1px solid #475569; overflow: hidden; }
        #previewCanvas { max-width: 100%; max-height: 100%; }
        
        input[type="text"], select, input[type="range"] { width: 100%; background: #0f172a; color: white; border: 1px solid #475569; padding: 6px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; box-sizing: border-box; }
        label { display: block; font-size: 11px; margin-bottom: 3px; color: #cbd5e1; }
        
        .inspect-btn { background: var(--accent); color: #000; padding: 15px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; width: 100%; margin-bottom: 10px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-box { text-align: center; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); font-size: 12px; }

        .filmstrip { height: 140px; background: #020617; border-top: 1px solid #334155; display: flex; gap: 10px; padding: 10px; overflow-x: auto; }
        .strip-frame { min-width: 120px; height: 120px; background: #1e293b; border: 2px solid var(--neutral); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .strip-frame.is-ok { border-color: var(--ok); }
        .strip-frame.is-nok { border-color: var(--viga); }
        .strip-frame img { width: 100%; height: 90px; object-fit: contain; background: #000; }
        .strip-frame span { font-size: 9px; display: block; text-align: center; padding: 2px; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="sidebar">
        <h3 style="margin:0; color:var(--accent); font-size: 18px; margin-bottom: 10px;">POCKET AOI</h3>
        <details open>
            <summary>ROI SEADED</summary>
            <div class="card-content">
                <label>Kuju</label>
                <select id="roiShapeSelect" onchange="config.roiShape = this.value; saveConfig();">
                    <option value="rect">Ruut</option>
                    <option value="circle">Ring</option>
                </select>
                <label><input type="checkbox" id="invertInput" onchange="config.invert = this.checked; saveConfig();"> Inverteeri</label>
            </div>
        </details>
        <details>
            <summary>FILTRID</summary>
            <div class="card-content">
                <label>Threshold: <b id="thrVal">127</b></label>
                <input type="range" id="thrInput" min="0" max="255" value="127" oninput="config.thr = this.value; saveConfig();">
                <label>Müra: <b id="morphVal">0</b></label>
                <input type="range" id="morphInput" min="-10" max="10" value="0" oninput="config.morph = this.value; saveConfig();">
            </div>
        </details>
        <details open>
            <summary>TÖÖRIIST</summary>
            <div class="card-content">
                <select id="toolSelect" onchange="config.tool = this.value; switchTool(); saveConfig();">
                    <option value="presence">Presence (Pikslid)</option>
                    <option value="blob">Blob (Loendus)</option>
                </select>
                <div id="presenceSettings" style="display:none;">
                    <label>Min. Pikslid: <b id="limitVal">5000</b></label>
                    <input type="range" id="limitInput" min="0" max="20000" value="5000" oninput="config.limit = this.value; saveConfig();">
                </div>
                <div id="blobSettings" style="display:none;">
                    <label>Min. Pindala: <b id="minBlobVal">100</b></label>
                    <input type="range" id="minBlobInput" min="5" max="5000" value="100" oninput="config.minBlob = this.value; saveConfig();">
                    <label>Kogus: <b id="minCountVal">1</b>-<b id="maxCountVal">1</b></label>
                    <input type="range" id="minCountInput" min="0" max="10" value="1" oninput="config.minCount = this.value; saveConfig();">
                    <input type="range" id="maxCountInput" min="1" max="20" value="1" oninput="config.maxCount = this.value; saveConfig();">
                </div>
            </div>
        </details>
    </div>

    <div id="viewport">
        <div id="container">
            <video id="v" autoplay playsinline muted></video>
            <canvas id="mainCanvas"></canvas>
        </div>
    </div>

    <div class="sidebar sidebar-right">
        <div id="mainStatus" class="status-hero">OOTEL</div>
        
        <label>SEERIANUMBER</label>
        <input type="text" id="snInput" placeholder="Sisesta SN..." autocomplete="off">
        <button class="inspect-btn" onclick="inspect()">INSPEKTEERI</button>

        <div class="preview-container"><canvas id="previewCanvas"></canvas></div>
        <div id="pxLive" style="text-align:center; font-family:monospace; color:var(--accent); font-size:11px; margin: 10px 0;">...</div>

        <div class="stat-grid">
            <div class="stat-box">KOKKU: <b id="countTotal">0</b></div>
            <div class="stat-box">FPY: <b id="valFPY">0%</b></div>
            <div class="stat-box" style="color:var(--ok)">PASS: <b id="countPass">0</b></div>
            <div class="stat-box" style="color:var(--viga)">FAIL: <b id="countFail">0</b></div>
        </div>
        <button onclick="resetStats()" style="margin-top:10px; font-size:9px; background:none; border:1px solid #475569; color:white; cursor:pointer; padding:5px; border-radius:4px; width:100%;">NULLI STATISTIKA</button>
    </div>
</div>

<div class="filmstrip" id="filmstrip"></div>

<script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="cvLoaded()"></script>

<script>
    const v = document.getElementById('v'), c = document.getElementById('mainCanvas'), ctx = c.getContext('2d');
    const pCanvas = document.getElementById('previewCanvas'), pCtx = pCanvas.getContext('2d');
    const hCanvas = document.createElement('canvas'), hCtx = hCanvas.getContext('2d');

    let config = JSON.parse(localStorage.getItem('aoi_config')) || { 
        roi: { x: 50, y: 50, w: 150, h: 150 }, roiShape: 'rect', thr: 127, morph: 0, invert: false, tool: 'blob', limit: 5000, minBlob: 100, minCount: 1, maxCount: 1 
    };
    let stats = JSON.parse(localStorage.getItem('aoi_stats')) || { total: 0, pass: 0, fail: 0 };
    let history = [];
    let opencvReady = false, isOkNow = false, isDragging = false, isResizing = false;
    let src, grey, thrMat, offset = { x: 0, y: 0 };

    function cvLoaded() { opencvReady = true; loadUI(); switchTool(); render(); }
    
    function loadUI() {
        document.getElementById('thrInput').value = config.thr;
        document.getElementById('morphInput').value = config.morph;
        document.getElementById('invertInput').checked = config.invert;
        document.getElementById('toolSelect').value = config.tool;
        document.getElementById('roiShapeSelect').value = config.roiShape;
        document.getElementById('limitInput').value = config.limit;
        document.getElementById('minBlobInput').value = config.minBlob;
        document.getElementById('minCountInput').value = config.minCount;
        document.getElementById('maxCountInput').value = config.maxCount;
        updateStatDisplay();
    }

    function switchTool() {
        document.getElementById('presenceSettings').style.display = (config.tool === 'presence') ? 'block' : 'none';
        document.getElementById('blobSettings').style.display = (config.tool === 'blob') ? 'block' : 'none';
    }

    function saveConfig() { localStorage.setItem('aoi_config', JSON.stringify(config)); }

    function inspect() {
        stats.total++;
        const sn = document.getElementById('snInput').value || "N/A";
        const result = isOkNow;
        
        if (result) stats.pass++; else stats.fail++;
        
        // Uuenda status ajutiselt
        const hero = document.getElementById('mainStatus');
        hero.innerText = result ? "PASS" : "FAIL";
        hero.className = `status-hero ${result ? 'pass' : 'fail'}`;
        
        // Salvesta pilt ajalukku
        addToFilmstrip(sn, result);
        
        updateStatDisplay();
        document.getElementById('snInput').value = "";
        localStorage.setItem('aoi_stats', JSON.stringify(stats));

        // 2 sekundi pärast tagasi OOTEL olekusse
        setTimeout(() => {
            hero.innerText = "OOTEL";
            hero.className = "status-hero";
        }, 2000);
    }

    function addToFilmstrip(sn, ok) {
        const time = new Date().toLocaleTimeString('et-EE', {hour12:false});
        const imgData = pCanvas.toDataURL('image/jpeg', 0.5);
        history.unshift({ sn, time, ok, imgData });
        if (history.length > 10) history.pop();
        
        document.getElementById('filmstrip').innerHTML = history.map(item => `
            <div class="strip-frame ${item.ok ? 'is-ok' : 'is-nok'}">
                <img src="${item.imgData}">
                <span>${item.sn} | ${item.time}</span>
            </div>
        `).join('');
    }

    function updateStatDisplay() {
        document.getElementById('countTotal').innerText = stats.total;
        document.getElementById('countPass').innerText = stats.pass;
        document.getElementById('countFail').innerText = stats.fail;
        document.getElementById('valFPY').innerText = (stats.total > 0 ? (stats.pass/stats.total*100).toFixed(1) : 0) + "%";
    }

    function resetStats() { stats = { total: 0, pass: 0, fail: 0 }; updateStatDisplay(); localStorage.setItem('aoi_stats', JSON.stringify(stats)); }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
        v.srcObject = stream;
        v.onloadedmetadata = () => {
            v.play();
            setTimeout(() => { c.width = v.videoWidth; c.height = v.videoHeight; hCanvas.width = v.videoWidth; hCanvas.height = v.videoHeight; }, 1000);
        };
    });

    c.onmousedown = (e) => {
        const rect = c.getBoundingClientRect();
        const px = (e.clientX - rect.left) * (c.width / rect.width);
        const py = (e.clientY - rect.top) * (c.height / rect.height);
        if (px > config.roi.x + config.roi.w - 30 && py > config.roi.y + config.roi.h - 30) isResizing = true;
        else if (px > config.roi.x && px < config.roi.x + config.roi.w && py > config.roi.y && py < config.roi.y + config.roi.h) { isDragging = true; offset = { x: px - config.roi.x, y: py - config.roi.y }; }
    };
    window.onmousemove = (e) => {
        if (!isDragging && !isResizing) return;
        const rect = c.getBoundingClientRect();
        const px = (e.clientX - rect.left) * (c.width / rect.width);
        const py = (e.clientY - rect.top) * (c.height / rect.height);
        if (isResizing) { config.roi.w = Math.max(30, px - config.roi.x); config.roi.h = Math.max(30, py - config.roi.y); }
        else if (isDragging) { config.roi.x = px - offset.x; config.roi.y = py - offset.y; }
    };
    window.onmouseup = () => { isDragging = isResizing = false; saveConfig(); };

    function render() {
        if (opencvReady && v.readyState >= 2) {
            try {
                hCtx.drawImage(v, 0, 0, hCanvas.width, hCanvas.height);
                if (!src) { src = new cv.Mat(v.videoHeight, v.videoWidth, cv.CV_8UC4); grey = new cv.Mat(); thrMat = new cv.Mat(); }
                src.data.set(hCtx.getImageData(0,0,v.videoWidth, v.videoHeight).data);
                
                let rx = Math.max(0, Math.floor(config.roi.x)), ry = Math.max(0, Math.floor(config.roi.y));
                let rw = Math.min(Math.floor(config.roi.w), src.cols - rx), rh = Math.min(Math.floor(config.roi.h), src.rows - ry);
                
                if (rw > 10 && rh > 10) {
                    let roiMat = src.roi(new cv.Rect(rx, ry, rw, rh));
                    cv.cvtColor(roiMat, grey, cv.COLOR_RGBA2GRAY);
                    let type = config.invert ? cv.THRESH_BINARY_INV : cv.THRESH_BINARY;
                    cv.threshold(grey, thrMat, parseInt(config.thr), 255, type);

                    let mVal = parseInt(config.morph);
                    if (mVal !== 0) {
                        let k = cv.Mat.ones(Math.abs(mVal), Math.abs(mVal), cv.CV_8U);
                        if (mVal < 0) cv.erode(thrMat, thrMat, k); else cv.dilate(thrMat, thrMat, k);
                        k.delete();
                    }

                    pCanvas.width = rw; pCanvas.height = rh;
                    if (config.tool === 'blob') {
                        let contours = new cv.MatVector(), hierarchy = new cv.Mat();
                        cv.findContours(thrMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                        let displayMat = new cv.Mat(); cv.cvtColor(thrMat, displayMat, cv.COLOR_GRAY2RGBA);
                        let count = 0;
                        let validContours = new cv.MatVector();
                        for (let i = 0; i < contours.size(); ++i) {
                            if (cv.contourArea(contours.get(i)) >= parseInt(config.minBlob)) { count++; validContours.push_back(contours.get(i)); }
                        }
                        cv.drawContours(displayMat, validContours, -1, new cv.Scalar(0, 255, 255, 255), 2);
                        isOkNow = (count >= parseInt(config.minCount) && count <= parseInt(config.maxCount));
                        cv.imshow(pCanvas, displayMat);
                        document.getElementById('pxLive').innerText = `BLOBS: ${count} / [${config.minCount}-${config.maxCount}]`;
                        contours.delete(); hierarchy.delete(); displayMat.delete(); validContours.delete();
                    } else {
                        let px = cv.countNonZero(thrMat);
                        isOkNow = px >= parseInt(config.limit);
                        cv.imshow(pCanvas, thrMat);
                        document.getElementById('pxLive').innerText = `PIKSLEID: ${px} / MIN: ${config.limit}`;
                    }
                    roiMat.delete();
                }
            } catch (e) { console.error(e); }
        }

        ctx.clearRect(0,0,c.width,c.height);
        ctx.strokeStyle = isOkNow ? "#10b981" : "#f43f5e";
        ctx.lineWidth = 3;
        if (config.roiShape === 'circle') {
            ctx.beginPath(); ctx.arc(config.roi.x + config.roi.w/2, config.roi.y + config.roi.h/2, Math.min(config.roi.w, config.roi.h)/2, 0, Math.PI*2); ctx.stroke();
        } else {
            ctx.strokeRect(config.roi.x, config.roi.y, config.roi.w, config.roi.h);
        }
        ctx.fillStyle = "white"; ctx.fillRect(config.roi.x + config.roi.w - 10, config.roi.y + config.roi.h - 10, 10, 10);
        
        document.getElementById('thrVal').innerText = config.thr;
        document.getElementById('morphVal').innerText = config.morph;
        document.getElementById('limitVal').innerText = config.limit;
        document.getElementById('minBlobVal').innerText = config.minBlob;
        document.getElementById('minCountVal').innerText = config.minCount;
        document.getElementById('maxCountVal').innerText = config.maxCount;

        requestAnimationFrame(render);
    }
</script>
</body>
</html>
